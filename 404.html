<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — NON&LO Investments Limited</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f0f8ff;
      color: #0c2d48;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .logo-wrap {
      margin-bottom: 40px;
    }
    .logo-wrap img {
      height: 64px; width: 64px;
      border-radius: 50%;
      object-fit: contain;
    }

    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(80px, 20vw, 140px);
      font-weight: 300;
      color: #0891b2;
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(22px, 5vw, 32px);
      font-weight: 600;
      color: #0c2d48;
      margin-bottom: 16px;
    }

    p {
      font-size: 15px;
      color: #4a7c96;
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      background: #0891b2;
      color: #fff;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #06b6d4; }

    .btn-outline {
      background: none;
      color: #0891b2;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 8px;
      border: 1.5px solid rgba(8,145,178,0.35);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-outline:hover {
      background: rgba(8,145,178,0.06);
      border-color: #0891b2;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, #0891b2, #06b6d4);
      border-radius: 2px;
      margin: 0 auto 32px;
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <a href="index.html">
      <img src="images/logo.png" alt="NON&LO Logo" />
    </a>
  </div>

  <div class="code">404</div>
  <div class="divider"></div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>

  <div class="actions">
    <a href="index.html" class="btn-primary">
      <i class="fa-solid fa-house"></i> Back to Homepage
    </a>
    <a href="catalogue.html" class="btn-outline">
      <i class="fa-solid fa-boxes-stacked"></i> Browse Catalogue
    </a>
  </div>

</body>
</html>
